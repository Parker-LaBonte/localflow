model: base/Qwen2.5-3B-Instruct
train: true
data: data6
fine_tune_type: lora
num_layers: 36
batch_size: 4
iters: 400
resume_adapter_file: ad_L5/adapters.safetensors
lr_schedule:
  name: cosine_decay
  warmup: 30
  warmup_init: 1.0e-6
  arguments: [3.0e-5, 400, 1.0e-6]
learning_rate: 3.0e-5
lora_parameters: {rank: 16, dropout: 0.05, scale: 20.0}
mask_prompt: true
max_seq_length: 512
steps_per_report: 50
steps_per_eval: 200
save_every: 200
adapter_path: ad_L6
seed: 6
